<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Recolha - Dellys</title>
    <style>
        :root { --primary: #012d5e; --secondary: #f4f7f9; --accent: #3498db; --danger: #e74c3c; --success: #2ecc71; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--secondary); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1100px; margin: auto; }
        .header { background: var(--primary); color: white; padding: 25px; border-radius: 12px; text-align: center; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
        textarea { width: 100%; height: 100px; border: 1px solid #ddd; border-radius: 8px; padding: 10px; margin: 10px 0; font-size: 13px; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; margin-top: 15px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #edf2f7; }
        th { background: #f8fafc; color: #64748b; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .status-badge { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .baixo { background: #fee2e2; color: var(--danger); }
        .ok { background: #dcfce7; color: var(--success); }
        .btn { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.3s; color: white; }
        .btn-primary { background: var(--primary); width: 100%; font-size: 16px; }
        .btn-save { background: var(--success); font-size: 12px; }
        .btn-wa { background: #25d366; font-size: 12px; margin-right: 5px; }
        input[type="text"] { border: 1px solid #ddd; padding: 5px; border-radius: 4px; width: 60px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Dashboard de Recolha Dellys</h1>
        <p>Monitoramento de Unidades e Histórico de Atividades</p>
    </div>

    <div class="card">
        <h3>1. Importar Dados do Relatório Mestre</h3>
        <p style="font-size: 13px; color: #666;">Cole aqui a coluna de CNPJ e a coluna de % RECOLHIDO da sua planilha atual:</p>
        <textarea id="inputDados" placeholder="Exemplo: 20705907/0005-97	85%"></textarea>
        <button class="btn btn-primary" onclick="processarPlanilha()">Vincular Dados às Unidades</button>
    </div>

    <div class="card" style="overflow-x: auto;">
        <h3>2. Gestão de Unidades</h3>
        <table id="tabelaControle">
            <thead>
                <tr>
                    <th>Unidade</th>
                    <th>CNPJ</th>
                    <th>% Atual</th>
                    <th>Status</th>
                    <th>Ações (Salvar Histórico)</th>
                </tr>
            </thead>
            <tbody id="listaUnidades">
                </tbody>
        </table>
    </div>
</div>

<script>
    // --- CONFIGURAÇÃO ---
    const WEB_APP_URL = "SUA_URL_AQUI"; // Cole aqui o link do Google Apps Script
    const META_RECOLHA = 92;

    const filiais = [
        {nome: "HOK - ITARIRI", cnpj: "20705907/0005-97"},
        {nome: "HOK - RIBEIRAO DAS NEVES", cnpj: "20705907/0017-20"},
        {nome: "HOK - BIGUAÇU", cnpj: "20705907/0002-44"},
        {nome: "HOK - CONTAGEM", cnpj: "20705907/0016-40"},
        {nome: "HOK - IVOTI", cnpj: "20705907/0004-06"},
        {nome: "HOK - EUNAPOLIS", cnpj: "20705907/0014-88"},
        {nome: "HOK - MANAUS", cnpj: "20705907/0020-26"},
        {nome: "HOK - HUBER CASCAVEL", cnpj: "20705907/0021-07"},
        {nome: "HOK - BRASILIA", cnpj: "20705907/0018-01"},
        {nome: "HOK - CAMPO LARGO", cnpj: "20705907/0003-25"},
        {nome: "HOK - ESTANCIA VELHA", cnpj: "20705907/0008-30"},
        {nome: "HOK - LINHARES", cnpj: "20705907/0006-78"},
        {nome: "HOK - JARAGUA DO SUL", cnpj: "20705907/0001-63"},
        {nome: "HOK - TEIXEIRA DE FREITAS", cnpj: "20705907/0007-59"},
        {nome: "HOK - UBERLANDIA", cnpj: "20705907/0023-79"},
        {nome: "HOK - VARZEA GRANDE", cnpj: "20705907/0027-00"},
        {nome: "HOK - MONTES CLAROS", cnpj: "20705907/0026-11"},
        {nome: "OESA - JARAGUA DO SUL", cnpj: "81611931/0001-28"},
        {nome: "OESA - CAMPO LARGO", cnpj: "81611931/0002-09"},
        {nome: "OESA - RIBEIRAO DAS NEVES", cnpj: "81611931/0005-51"},
        {nome: "OESA - CASCAVEL", cnpj: "81611931/0052-78"},
        {nome: "OESA - BRASILIA", cnpj: "81611931/0022-52"},
        {nome: "OESA - ESTANCIA VELHA", cnpj: "81611931/0010-19"},
        {nome: "OESA - CONTAGEM", cnpj: "81611931/0029-29"},
        {nome: "OESA - IVOTI", cnpj: "81611931/0049-72"},
        {nome: "OESA - ITARIRI", cnpj: "81611931/0006-32"},
        {nome: "OESA - EUNAPOLIS", cnpj: "81611931/0045-49"},
        {nome: "OESA - LINHARES", cnpj: "81611931/0036-58"},
        {nome: "OESA - PORTO SEGURO", cnpj: "81611931/0044-68"},
        {nome: "OESA - BIGUACU", cnpj: "81611931/0009-85"}
    ];

    function renderTabela(dadosMapeados = {}) {
        const tbody = document.getElementById('listaUnidades');
        tbody.innerHTML = "";

        filiais.forEach(f => {
            const perc = dadosMapeados[f.cnpj] || 0;
            const statusClass = perc < META_RECOLHA ? 'baixo' : 'ok';
            const statusTxt = perc < META_RECOLHA ? 'COBRAR' : 'OK';

            tbody.innerHTML += `
                <tr>
                    <td><strong>${f.nome}</strong></td>
                    <td><small>${f.cnpj}</small></td>
                    <td><input type="text" id="perc-${f.cnpj}" value="${perc}%"></td>
                    <td><span class="status-badge ${statusClass}">${statusTxt}</span></td>
                    <td>
                        <button class="btn btn-wa" onclick="window.open('https://wa.me/')">WhatsApp</button>
                        <button class="btn btn-save" onclick="salvarNoGoogle('${f.nome}', '${f.cnpj}')">Salvar Histórico</button>
                    </td>
                </tr>
            `;
        });
    }

    function processarPlanilha() {
        const texto = document.getElementById('inputDados').value;
        const linhas = texto.split('\n');
        const mapa = {};

        linhas.forEach(linha => {
            const partes = linha.split('\t');
            if (partes.length >= 2) {
                const cnpjLimpo = partes[0].trim();
                const valor = parseFloat(partes[1].replace('%', '').replace(',', '.'));
                mapa[cnpjLimpo] = valor;
            }
        });

        renderTabela(mapa);
    }

    async function salvarNoGoogle(nome, cnpj) {
        const perc = document.getElementById(`perc-${cnpj}`).value;
        const btn = event.target;
        btn.innerText = "Salvando...";
        btn.disabled = true;

        const payload = {
            unidade: nome,
            cnpj: cnpj,
            porcentagem: perc,
            tipo_contato: "Registro Automático",
            obs: "Importado via Dashboard"
        };

        try {
            await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            btn.innerText = "Gravado ✓";
            btn.style.background = "#2ecc71";
        } catch (error) {
            alert("Erro ao salvar. Verifique a URL do Google Script.");
            btn.innerText = "Erro";
            btn.disabled = false;
        }
    }

    window.onload = () => renderTabela();
</script>

</body>
</html>
